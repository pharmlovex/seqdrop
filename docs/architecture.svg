"4" fill="#e07800"></rect><rect x="854" y="140" width="52" height="52" rx="12" fill="#e07800"></rect><text x="880" y="175" class="t" fill="#fff" text-anchor="middle" style="font-size:24px;fill:#fff">λ</text><text x="922" y="164" class="t">create_upload</text><text x="922" y="188" class="s">Lambda · register + presign</text><rect x="830" y="256" width="380" height="92" rx="16" fill="#f8fafc" stroke="#d5dbe5" stroke-width="1.5"></rect><rect x="830" y="256" width="8" height="92" rx="4" fill="#e07800"></rect><rect x="854" y="276" width="52" height="52" rx="12" fill="#e07800"></rect><text x="880" y="311" class="t" fill="#fff" text-anchor="middle" style="font-size:24px;fill:#fff">λ</text><text x="922" y="300" class="t">get_sample / list_samples</text><text x="922" y="324" class="s">Lambda · read results</text><rect x="1370" y="130" width="300" height="230" rx="16" fill="#f8fafc" stroke="#d5dbe5" stroke-width="1.5"></rect><rect x="1370" y="130" width="8" height="230" rx="4" fill="#3b6fe0"></rect><rect x="1394" y="154" width="52" height="52" rx="12" fill="#3b6fe0"></rect><text x="1420" y="189" class="t" fill="#fff" text-anchor="middle" style="font-size:24px;fill:#fff">▤</text><text x="1462" y="174" class="t">DynamoDB</text><text x="1462" y="198" class="s">samples table</text><text x="1462" y="238" class="m">sample_id · status</text><text x="1462" y="266" class="m">checksums · metadata</text><text x="1462" y="294" class="m">rejection_reason</text><text x="1462" y="322" class="m">by_status index</text><rect x="440" y="590" width="300" height="250" rx="16" fill="#f8fafc" stroke="#d5dbe5" stroke-width="1.5"></rect><rect x="440" y="590" width="8" height="250" rx="4" fill="#2f9e44"></rect><rect x="464" y="614" width="52" height="52" rx="12" fill="#2f9e44"></rect><text x="490" y="649" class="t" fill="#fff" text-anchor="middle" style="font-size:24px;fill:#fff">▣</text><text x="532" y="634" class="t">S3 bucket</text><text x="532" y="658" class="s">one bucket, three prefixes</text><r