</rect><text x="1220" y="751" class="t" text-anchor="middle" style="font-size:17px;fill:#fff">λ</text><text x="1246" y="751" class="m" style="font-weight:700;fill:#0f172a">extract_metadata</text><text x="1405.6" y="751" class="s" style="font-size:15px">reads, GC%, variants</text><rect x="1194" y="782" width="382" height="50" rx="10" fill="#fff" stroke="#f0b8cb"></rect><rect x="1206" y="793" width="28" height="28" rx="7" fill="#e07800"></rect><text x="1220" y="813" class="t" text-anchor="middle" style="font-size:17px;fill:#fff">λ</text><text x="1246" y="813" class="m" style="font-weight:700;fill:#0f172a">move_object</text><text x="1360.1" y="813" class="s" style="font-size:15px">→ validated/ or quarantine/</text><rect x="1660" y="600" width="200" height="100" rx="16" fill="#f8fafc" stroke="#d5dbe5" stroke-width="1.5"></rect><rect x="1660" y="600" width="8" height="100" rx="4" fill="#d6336c"></rect><rect x="1684" y="624" width="52" height="52" rx="12" fill="#d6336c"></rect><text x="1710" y="659" class="t" fill="#fff" text-anchor="middle" style="font-size:24px;fill:#fff">✉</text><text x="1752" y="648" class="t">SNS</text><text x="1752" y="672" class="s">email alert</text><rect x="1660" y="780" width="200" height="84" rx="16" fill="#fff" stroke="#d5dbe5" stroke-width="1.5" stroke-dasharray="6 5"></rect><text x="1760" y="818" class="t" text-anchor="middle" style="font-size:19px">Researcher inbox</text><text x="1760" y="842" class="s" text-anchor="middle" style="font-size:13px">VALIDATED / QUARANTINED</text><path d="M310,405 C380,405 380,205 436,205" fill="none" stroke="#e07800" stroke-width="3" marker-end="url(#a1)" stroke-dasharray="none" stroke-linecap="round"></path><rect x="196.921875" y="282" width="127.078125" height="24" rx="6" class="lblbg"></rect><text x="318" y="300" class="lbl" fill="#e07800" text-anchor="end">POST /samples</text><circle cx="330" cy="405" r="15" fill="#e07800"></circle><text x="330" y="411" class="t" text-anchor="middle" style="font-size:17px;fill:#fff">1</text><path d="M720,200 C780,200 770,166 826,166" fill="none" stroke="#e07800" stroke-width="3" marker-end="url(#a1)" stroke-dasharray="none" stroke-linecap="round"></path><path d="M1210,166 L1366,190" fill="none" stroke="#e07800" stroke-width="3" marker-end="url(#a1)" stroke-dasharray="none" stroke-linecap="round"></path><rect x="1205.890625" y="136" width="164.21875" height="24" rx="6" class="lblbg"></rect><text x="1288" y="154" class="lbl" fill="#e07800" text-anchor="middle">AWAITING_UPLOAD</text><path d="M440,245 C400,245 400,450 314,450" fill="none" stroke="#e07800" stroke-width="3" marker-end="url(#a1)" stroke-dasharray="9 7" stroke-linecap="round"></path><rect x="406" y="332" width="134.890625" height="24.0052490234375" rx="6" class="lblbg"></rect><text x="412" y="350" class="lbl" fill="#e07800" text-anchor="start">presigned POST</text><path d="M310,505 C380,505 380,718 436,718" fill="none" stroke="#2f9e44" stroke-width="3" marker-end="url(#a2)" stroke-dasharray="none" stroke-linecap="round"></path><rect x="140.90625" y="622" width="183.09375" height="24" rx="6" class="lblbg"></rect><text x="318" y="640" class="lbl" fill="#2f9e44" text-anchor="end">upload file direct to S3</text><circle cx="330" cy="505" r="15" fill="#2f9e44"></circle><text x="330" y="511" class="t" text-anchor="middle" style="font-size:17px;fill:#fff">2</text><path d="M740,700 L876,700" fill="none" stroke="#d6336c" stroke-width="3" marker-end="url(#a3)" stroke-dasharray="none" stroke-linecap="round"></path><rect x="746.53125" y="666" width="126.9375" height="24" rx="6" class="lblbg"></rect><text x="810" y="684" class="lbl" fill="#d6336c" text-anchor="middle">Object Created</text><circle cx="760" cy="700" r="15" fill="#d6336c"></circle><text x="760" y="706" class="t" text-anchor="middle" style="font-size:17px;fill:#fff">3</text><path d="M1110,700 L1166,700" fill="none" stroke="#d6336c" stroke-width="3" marker-end="url(#a3)" stroke-dasharray="none" stroke-linecap="round"></path><r