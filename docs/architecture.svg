="1264.9296875" y="274" width="46.140625" height="24" rx="6" class="lblbg"></rect><text x="1288" y="292" class="lbl" fill="#3b6fe0" text-anchor="middle">read</text><circle cx="74" cy="979" r="13" fill="#e07800"></circle><text x="74" y="984" class="t" text-anchor="middle" style="font-size:15px;fill:#fff">1</text><text x="98" y="985" class="t" style="font-size:17px">Register</text><text x="190" y="985" class="s" style="font-size:16px">API creates the sample record and returns a size-limited presigned POST</text><circle cx="974" cy="979" r="13" fill="#2f9e44"></circle><text x="974" y="984" class="t" text-anchor="middle" style="font-size:15px;fill:#fff">2</text><text x="998" y="985" class="t" style="font-size:17px">Upload</text><text x="1070" y="985" class="s" style="font-size:16px">the file goes straight to S3 and never passes through Lambda or API Gateway</text><circle cx="74" cy="1017" r="13" fill="#d6336c"></circle><text x="74" y="1022" class="t" text-anchor="middle" style="font-size:15px;fill:#fff">3</text><text x="98" y="1023" class="t" style="font-size:17px">Process</text><text x="180" y="1023" class="s" style="font-size:16px">EventBridge starts one Step Functions run that validates, catalogues, moves and notifies</text><circle cx="974" cy="1017" r="13" fill="#3b6fe0"></circle><text x="974" y="1022" class="t" text-anchor="middle" style="font-size:15px;fill:#fff">4</text><text x="998" y="1023" class="t" style="font-size:17px">Query</text><text x="1060" y="1023" class="s" style="font-size:16px">GET returns status, checksums, metadata or the rejection reason</text><text x="1840" y="1062" class="s" text-anchor="end" style="font-size:14px">DynamoDB writes and the SNS publish are direct Step Functions integrations (no Lambda).</text></svg>